<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Contact - Portofolio TKJ</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: Arial, sans-serif;
}

body {
  background: #0f0f0f;
  color: #3b82f6;
}

/* NAVBAR */
nav {
  display: flex;
  justify-content: space-between;
  padding: 20px 50px;
  background: #000;
}

nav ul {
  display: flex;
  gap: 20px;
  list-style: none;
}

nav a {
  color: white;
  text-decoration: none;
}

/* CONTACT */
.contact {
  padding: 60px;
  display: flex;
  justify-content: center;
}

.card {
  background: rgba(255,255,255,0.05);
  padding: 30px;
  border-radius: 15px;
  max-width: 500px;
  width: 100%;
  backdrop-filter: blur(10px);
  box-shadow: 0 10px 30px rgba(0,0,0,0.5);
}

/* GALERI */
.gallery {
  padding: 60px;
  display: grid;
  grid-template-columns: repeat(2, 1fr); /* 2 kolom sama */
  gap: 20px;
}

/* GAMBAR */
.gallery img {
  width: 100%;
  height: 250px;        /* bikin tinggi sama */
  object-fit: cover;    /* biar gak gepeng */
  border-radius: 15px;
  transition: 0.3s;
}

/* HOVER */
.gallery img:hover {
  transform: scale(1.05);
}

/* RESPONSIVE */
@media(max-width: 768px){
  .gallery {
    grid-template-columns: 1fr;
  }
}
</style>

</head>
<body>

</nav>

</section>
